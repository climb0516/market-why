name: MarketWhy Scraper

on:
  schedule:
    - cron: '7,22,37,52 * * * 1-5'   # 工作日（UTC）每 15 分钟：亚洲、欧洲、美股时段基本连着，快讯滚得快
    - cron: '7 * * * 0,6'            # 周末每小时，补周五美股收盘后和周一亚洲开盘前的消息
  workflow_dispatch:                 # 支持手动触发
  push:
    branches: [main]
    paths: ['scraper.py', '.github/workflows/scrape.yml']

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run scraper
        run: python scraper.py
      - name: Commit data.json / analysis.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json analysis.json
          git diff --cached --quiet || git commit -m "data: update $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
