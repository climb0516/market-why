<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>样张 A · 仿 App</title>
<style>
  :root {
    --bg: #0b0b0c; --sec: #161618; --card: #232326; --card-hi: #2b2b2f;
    --t1: #f5f5f7; --t2: #a1a1a6; --t3: #6e6e73; --line: rgba(255,255,255,.06);
    --up: #ff453a; --down: #30d158; --accent: #ff9f0a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--t1); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; padding-bottom: 96px; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--t2); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

  header { display: flex; align-items: center; gap: 12px; padding: 18px 0 10px; }
  .logo { width: 40px; height: 40px; border-radius: 11px; background: radial-gradient(circle at 30% 30%, #6ac4ff, #1660c8 70%); display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
  .logo svg { width: 24px; height: 24px; }
  header h1 { font-size: 26px; font-weight: 800; letter-spacing: .02em; }
  .status { display: flex; align-items: center; gap: 10px; margin: 6px 0 16px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(48,209,88,.12); color: var(--down); font-weight: 700; font-size: 15px; padding: 5px 12px; border-radius: 999px; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--down); }
  .status span { color: var(--t2); font-size: 14px; }

  .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } .grid .full { grid-column: 1 / -1; } }

  .sec { background: var(--sec); border-radius: 22px; padding: 18px 16px 16px; }
  .sec-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .sec-h h2 { font-size: 21px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
  .sec-h h2::before { content: ''; width: 5px; height: 22px; border-radius: 3px; background: var(--accent); }
  .pill { font-size: 13px; color: var(--t2); background: var(--card); border: 1px solid rgba(255,255,255,.08); border-radius: 999px; padding: 4px 12px; display: inline-flex; align-items: center; gap: 6px; }
  .pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--t3); }

  .cards { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .cards > *, .grid > * { min-width: 0; }
  @media (min-width: 900px) { .full .cards { grid-template-columns: repeat(4, 1fr); } }
  .qc { background: var(--card); border-radius: 16px; padding: 14px 14px 12px; }
  .qc .n { font-size: 15px; color: var(--t1); opacity: .85; }
  .qc .r { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 4px; gap: 6px; }
  .qc b { font-size: 28px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .pc { font-size: 16px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  @media (max-width: 440px) {
    .qc { padding: 12px; } .qc b { font-size: 23px; } .qc .r { flex-direction: column; align-items: flex-start; gap: 0; }
    .pc { font-size: 14.5px; } .tc { padding: 14px 12px; } .tc .n { font-size: 15.5px; } .tc .n em { font-size: 17px; }
    .stk .px { width: 64px; } .stk .pc { width: 84px; }
  }
  .tc { background: var(--card); border-radius: 16px; padding: 16px 14px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .tc .n { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
  .tc .n em { font-style: normal; font-size: 20px; }

  .row { display: flex; gap: 12px; padding: 14px 4px; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row .tm { width: 50px; flex: none; color: var(--t3); font-size: 13px; font-variant-numeric: tabular-nums; padding-top: 2px; }
  .row .mk { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .badge { font-size: 13px; font-weight: 700; padding: 1px 8px; border-radius: 6px; }
  .badge.up { background: rgba(255,69,58,.15); } .badge.down { background: rgba(48,209,88,.15); }
  .why { color: var(--t2); font-size: 14px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ev .rk { width: 26px; flex: none; font-weight: 800; font-size: 18px; color: var(--t3); }
  .ev .rk.hot { color: var(--accent); }
  .ev .tt { font-weight: 600; font-size: 16px; line-height: 1.45; }
  .ev .meta { color: var(--t3); font-size: 13px; margin-top: 4px; }

  .stk { display: flex; align-items: center; gap: 10px; padding: 13px 4px; border-top: 1px solid var(--line); }
  .stk:first-of-type { border-top: 0; }
  .stk .m { font-size: 11px; font-weight: 700; color: var(--t2); background: var(--card); border-radius: 5px; padding: 1px 5px; }
  .stk .nm { flex: 1; font-weight: 600; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stk .px { width: 80px; text-align: right; font-variant-numeric: tabular-nums; color: var(--t2); }
  .stk .pc { width: 92px; text-align: right; }
  .hero { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .hero em { font-style: normal; font-size: 34px; }
  .hero b { font-size: 24px; font-weight: 800; display: block; }
  .hero .pc { font-size: 22px; }

  .foot { text-align: center; color: var(--t3); font-size: 13px; padding: 20px 0; }
  nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(22,22,24,.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); }
  nav.tabbar a { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--t3); font-size: 12px; text-decoration: none; min-width: 56px; }
  nav.tabbar a.on { color: var(--up); }
  nav.tabbar svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg></div>
    <h1>MarketWhy</h1>
  </header>
  <div class="status"><span class="chip"><i></i>全球</span><span id="upd">加载中…</span></div>
  <div class="grid" id="app"></div>
  <div class="foot">本页展示的公开数据仅供参考，不构成任何投资建议</div>
</div>
<nav class="tabbar">
  <a><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/></svg>总览</a>
  <a class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>全球</a>
  <a><svg viewBox="0 0 24 24"><path d="M12 3l9 9-9 9-9-9z"/></svg>有色</a>
  <a><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9.5c0-1.5 1.3-2.5 3-2.5s3 1 3 2.5c0 2-3 2-3 4M12 17h.01"/></svg>AI</a>
  <a><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg>快讯</a>
</nav>
<script src="common.js"></script>
<script>
(async () => {
  const { esc, hm, cls, pct, fmtP, usSession } = MW;
  const d = await MW.load();
  const P = v => `<span class="pc ${cls(v)}">${v > 0 ? '▲' : v < 0 ? '▼' : ''} ${pct(v)}</span>`;
  document.getElementById('upd').textContent = '已更新 ' + d.updated;
  document.getElementById('app').innerHTML = `
    <section class="sec full"><div class="sec-h"><h2>全球经济数据</h2></div>
      <div class="cards">${d.macro.map(m => `<div class="qc"><div class="n">${esc(m.name)}</div><div class="r"><b>${fmtP(m.q.price)}</b>${P(m.q.pct)}</div></div>`).join('')}</div></section>
    <section class="sec full"><div class="sec-h"><h2>全球产业数据</h2><span class="pill"><i></i>${usSession()}</span></div>
      <div class="cards">${d.industry.map(t => `<div class="tc"><div class="n"><em>${t.icon}</em>${esc(t.name)}</div>${P(t.pct)}</div>`).join('')}</div></section>
    <section class="sec"><div class="sec-h"><h2>今日异动</h2></div>
      ${d.topMoves.map(({ m, mv, news }) => `<div class="row"><div class="tm">${mv.kind === 'gap' ? '开盘' : hm(mv.start)}</div><div style="flex:1;min-width:0">
        <div class="mk">${esc(m.name)}<span class="badge ${cls(mv.chg)}">${mv.dir > 0 ? '▲' : '▼'} ${Math.abs(mv.chg).toFixed(2)}${m.unit === 'bp' ? 'bp' : '%'}</span></div>
        <div class="why">${news[0] ? esc(news[0].title) : '同时段没有匹配到相关新闻'}</div></div></div>`).join('')}</section>
    <section class="sec"><div class="sec-h"><h2>影响市场的大事</h2></div>
      ${d.events.map((e, i) => `<div class="row ev"><div class="rk ${i < 3 ? 'hot' : ''}">${i + 1}</div><div><div class="tt">${esc(e.title)}</div>
        <div class="meta">${hm(e.ts)} · ${e.refs.length} 家报道${e.factors[0] ? ' · ' + esc(d.FAC[e.factors[0]]) : ''}</div></div></div>`).join('')}</section>
    <section class="sec full"><div class="sec-h"><h2>主题详情 · 示例</h2></div>
      <div class="hero"><em>${d.aiTheme.icon}</em><div><b>${esc(d.aiTheme.name)}</b><span style="color:var(--t3);font-size:13px">${d.aiTheme.rows.length} 只成分股等权平均</span></div><div style="margin-left:auto">${P(d.aiTheme.pct)}</div></div>
      ${d.aiTheme.rows.map(r => `<div class="stk"><span class="m">${r.mkt}</span><span class="nm">${esc(r.name)}</span><span class="px">${fmtP(r.q.price)}</span>${P(r.q.pct)}</div>`).join('')}</section>`;
})();
</script>
</body>
</html>
