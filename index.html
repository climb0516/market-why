<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<title>MarketWhy · 行情为什么动</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%232962ff'/><path d='M13 4L6 14h5l-1 6 7-10h-5z' fill='white'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* 设计规范：配色参考 TradingView 深色主题，手机上借用 App 式大数字卡片 + 底部标签栏 */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root, :root[data-theme="dark"] {
    --bg: #0f1218; --panel: #171b24; --panel-2: #1f2430; --line: #2a2f3b; --line-2: #363c4a; --hover: rgba(255,255,255,.035);
    --text-1: #e8eaf0; --text-2: #9aa1b1; --text-3: #646b7b;
    --accent: #2962ff; --accent-soft: rgba(41,98,255,.14);
    --up: #f23645; --down: #089981; --up-bg: rgba(242,54,69,.14); --down-bg: rgba(8,153,129,.15);
    --heat-gap: #0b0d12; --heat-head: #1a1e27; --heat-zero: #3a3f4b;
    --f-monetary: #f59e0b; --f-macro: #3b82f6; --f-geo: #ef4444; --f-policy: #a855f7; --f-tech: #06b6d4; --f-earnings: #10b981; --f-commodity: #d97706; --f-fx: #94a3b8;
  }
  :root[data-theme="light"] {
    --bg: #f4f5f8; --panel: #ffffff; --panel-2: #f0f2f6; --line: #e2e5eb; --line-2: #d0d5de; --hover: rgba(19,23,34,.035);
    --text-1: #131722; --text-2: #4c5262; --text-3: #8a90a0;
    --accent: #2962ff; --accent-soft: rgba(41,98,255,.1);
    --up: #e5283a; --down: #078a73; --up-bg: rgba(229,40,58,.1); --down-bg: rgba(7,138,115,.1);
    --heat-gap: #ffffff; --heat-head: #e9ecf1; --heat-zero: #8b919d;
    --f-monetary: #d97706; --f-macro: #2563eb; --f-geo: #dc2626; --f-policy: #9333ea; --f-tech: #0891b2; --f-earnings: #059669; --f-commodity: #b45309; --f-fx: #64748b;
  }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text-1); font: 14px/1.55 Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--text-2); }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 20px; }
  svg.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* 顶栏 */
  header { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 22px; height: 56px; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 17px; white-space: nowrap; }
  .brand .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: #fff; }
  .brand .logo svg { width: 16px; height: 16px; fill: #fff; stroke: none; }
  .brand small { font-weight: 500; color: var(--text-3); font-size: 12px; }
  nav.tabs { display: flex; gap: 2px; }
  nav.tabs button { padding: 7px 13px; border-radius: 8px; color: var(--text-2); font-weight: 600; font-size: 13.5px; }
  nav.tabs button:hover { color: var(--text-1); background: var(--hover); }
  nav.tabs button.on { color: var(--text-1); background: var(--panel-2); }
  .spacer { flex: 1; }
  .meta { color: var(--text-3); font-size: 12px; white-space: nowrap; }
  .tools { display: flex; gap: 2px; }
  .icon-btn { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: var(--text-2); }
  .icon-btn:hover { background: var(--hover); color: var(--text-1); }

  /* 手机底部标签栏 */
  nav.tabbar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--line); padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); justify-content: space-around; }
  nav.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-3); font-size: 11px; font-weight: 600; min-width: 58px; padding: 2px 0; }
  nav.tabbar button svg.ic { width: 24px; height: 24px; stroke-width: 1.6; }
  nav.tabbar button.on { color: var(--accent); }

  /* 行情条 */
  .ticker { display: flex; gap: 10px; overflow-x: auto; padding: 16px 0 2px; scrollbar-width: none; }
  .ticker::-webkit-scrollbar { display: none; }
  .tk { flex: 0 0 158px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px 6px; cursor: pointer; transition: border-color .15s; }
  .tk:hover { border-color: var(--line-2); }
  .tk.on { border-color: var(--accent); }
  .tk .n { font-size: 12.5px; color: var(--text-2); display: flex; justify-content: space-between; gap: 6px; white-space: nowrap; }
  .tk .n em { font-style: normal; font-size: 10.5px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0 5px; }
  .tk .v { display: flex; justify-content: space-between; align-items: baseline; margin-top: 1px; }
  .tk .v b { font-size: 15px; font-weight: 700; }
  .tk .v span { font-size: 12.5px; font-weight: 600; }
  .tk svg.sp { width: 100%; height: 24px; display: block; margin-top: 3px; }

  /* 卡片与栅格 */
  .row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin-top: 14px; }
  @media (min-width: 980px) { .row { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); } }
  .page { display: grid; gap: 14px; margin: 16px 0 40px; }
  .page > * { min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
  .card > h2, .ch { font-size: 15.5px; font-weight: 700; padding: 15px 18px 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card > h2 small, .ch small { color: var(--text-3); font-weight: 500; font-size: 12px; }
  .card > h2 .r, .ch .r { margin-left: auto; }
  .card > h2 svg.ic { color: var(--accent); }
  .pad { padding: 0 18px 16px; }
  .empty { color: var(--text-3); padding: 26px 18px; text-align: center; font-size: 13px; }
  .hint { color: var(--text-3); font-size: 12px; padding: 0 18px 14px; }
  .more-link { color: var(--accent); font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }

  /* 涨跌：彩色文字 / 彩色底块 */
  .pct { font-weight: 700; white-space: nowrap; }
  .chg { display: inline-block; min-width: 70px; padding: 2px 7px; border-radius: 6px; font-weight: 700; font-size: 13px; text-align: center; color: #fff; white-space: nowrap; }
  .bx { flex: none; min-width: 66px; height: 38px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 13px; padding: 0 6px; }
  .bx.up { background: var(--up-bg); color: var(--up); } .bx.down { background: var(--down-bg); color: var(--down); } .bx.flat { background: var(--panel-2); }

  .src { flex: none; display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 4px; color: #fff; line-height: 1.55; }
  .src svg.ic { width: 10px; height: 10px; stroke-width: 2.4; }
  .ftag { font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 4px; line-height: 18px; white-space: nowrap; }

  /* 今日市场总结 */
  .sum ul { list-style: none; display: grid; gap: 11px; padding: 0 18px; }
  .sum li { font-size: 14.5px; line-height: 1.75; padding-left: 16px; position: relative; color: var(--text-1); }
  .sum li::before { content: ''; position: absolute; left: 0; top: .72em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .sum li b { font-weight: 700; }
  .cite { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--line-2); color: var(--text-2); font-size: 10.5px; font-weight: 700; vertical-align: 2px; margin-left: 2px; }
  .cite:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .srcs { display: flex; gap: 8px; overflow-x: auto; margin: 14px 18px 0; padding: 14px 0 2px; border-top: 1px solid var(--line); scrollbar-width: none; }
  .srcs a { flex: 0 0 210px; background: var(--panel-2); border-radius: 10px; padding: 9px 11px; font-size: 12px; color: var(--text-3); }
  .srcs a:hover { box-shadow: 0 0 0 1px var(--line-2); }
  .srcs b { color: var(--text-1); font-weight: 600; font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 3px; }
  .gen { color: var(--text-3); font-size: 11.5px; padding: 10px 18px 16px; }

  /* 列表行：异动、大事 */
  .li { display: flex; gap: 12px; padding: 11px 18px; border-top: 1px solid var(--line); cursor: pointer; align-items: flex-start; }
  .li:hover { background: var(--hover); }
  .li .body { min-width: 0; flex: 1; }
  .li .t { font-weight: 600; font-size: 14px; line-height: 1.45; }
  .li .t span { color: var(--text-3); font-weight: 500; font-size: 12px; margin-left: 6px; }
  .li .s { color: var(--text-2); font-size: 13px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .li .m { color: var(--text-3); font-size: 12px; margin-top: 4px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .li .rk { width: 20px; flex: none; font-weight: 800; font-size: 15px; color: var(--text-3); padding-top: 1px; }
  .li .rk.hot { color: var(--accent); }
  .ev .more { display: none; margin-top: 8px; }
  .ev.open .more { display: block; }
  .ev .more p { color: var(--text-2); font-size: 13px; margin-bottom: 6px; }
  .ev .more a { display: flex; gap: 6px; font-size: 12.5px; color: var(--text-2); padding: 2px 0; align-items: baseline; }
  .ev .more a:hover { color: var(--accent); }

  /* 因素热度 */
  .fac { padding: 2px 18px 16px; display: grid; gap: 9px; }
  .fac-row { display: grid; grid-template-columns: 70px 1fr 34px; align-items: center; gap: 10px; cursor: pointer; font-size: 13px; }
  .fac-row .bar { height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
  .fac-row .bar i { display: block; height: 100%; border-radius: 4px; }
  .fac-row .c { text-align: right; color: var(--text-2); font-size: 12px; }

  /* 热力图（Finviz 风格）*/
  .heat { position: relative; width: 100%; background: var(--heat-gap); border-radius: 8px; overflow: hidden; }
  .heat .grp { position: absolute; border: 2px solid var(--heat-gap); }
  .heat .gl { position: absolute; left: 0; right: 0; top: 0; height: 20px; padding: 0 6px; font-size: 11.5px; font-weight: 700; color: var(--text-1); background: var(--heat-head); display: flex; justify-content: space-between; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; cursor: pointer; }
  .heat .gl:hover { color: var(--accent); }
  .heat .cell { position: absolute; border: 1px solid var(--heat-gap); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; overflow: hidden; color: #fff; line-height: 1.15; cursor: pointer; }
  .heat .cell:hover { filter: brightness(1.18); }
  .heat .cell b { font-weight: 700; } .heat .cell span { opacity: .92; }
  .legend { display: inline-flex; align-items: center; gap: 2px; font-size: 11px; color: var(--text-2); font-weight: 500; }
  .legend i { width: 22px; height: 10px; display: inline-block; }

  /* 板块页：分区、卡片 */
  .board { display: grid; gap: 14px; margin: 16px 0 40px; }
  .sec-h { display: flex; align-items: center; gap: 10px; padding: 15px 18px 12px; flex-wrap: wrap; }
  .sec-h h2 { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
  .sec-h h2::before { content: ''; width: 4px; height: 18px; border-radius: 2px; background: var(--accent); }
  .sec-h .r { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .stt { font-size: 12px; color: var(--text-2); border: 1px solid var(--line-2); border-radius: 999px; padding: 2px 10px; display: inline-flex; align-items: center; gap: 6px; }
  .stt i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); }
  .stt.live i { background: var(--down); box-shadow: 0 0 6px var(--down); }
  /* 数据格子：和参考截图一致——行情是「名称 / 大号价格 + ▲▼涨跌」，行业是「图标 名称 …… ▲▼涨跌」 */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; padding: 0 18px 18px; }
  .cards > * { min-width: 0; }
  .qc { background: var(--panel-2); border-radius: 12px; padding: 12px 14px; cursor: pointer; border: 1px solid transparent; }
  .qc:hover, .tc:hover { border-color: var(--line-2); }
  .qc .n { font-size: 14px; color: var(--text-2); }
  .qc .r { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .qc b { font-size: 25px; font-weight: 800; letter-spacing: -.01em; }
  .qc .pct { font-size: 15px; }
  .tc { background: var(--panel-2); border-radius: 12px; padding: 0 14px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 54px; border: 1px solid transparent; }
  .tc .n { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 16px; font-weight: 700; }
  .tc .n span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tc .emo { font-size: 19px; line-height: 1; flex: none; }
  .tc .pct { font-size: 15px; flex: none; }
  .emo { font-style: normal; }
  .board-foot { text-align: center; color: var(--text-3); font-size: 12px; }

  /* 详情页公共 */
  .back { display: inline-flex; align-items: center; gap: 4px; color: var(--text-2); font-size: 13px; font-weight: 600; padding: 4px 0; }
  .back:hover { color: var(--text-1); }
  .ph { padding: 18px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .ph .big-ico { width: 48px; height: 48px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
  .ph .big-ico svg.ic { width: 26px; height: 26px; }
  .ph .big-ico .emo { font-size: 28px; line-height: 1; }
  .ph h1 { font-size: 22px; font-weight: 800; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .ph h1 small { font-size: 13px; color: var(--text-3); font-weight: 500; }
  .ph .px { display: flex; gap: 12px; align-items: baseline; margin-top: 3px; flex-wrap: wrap; }
  .ph .px b { font-size: 28px; font-weight: 800; letter-spacing: -.01em; }
  .ph .px span { font-size: 16px; font-weight: 700; }
  .ph .note { width: 100%; font-size: 12.5px; color: var(--text-3); background: var(--panel-2); border-radius: 8px; padding: 7px 10px; }
  .mtag { font-size: 10.5px; font-weight: 700; padding: 0 5px; border-radius: 4px; background: var(--panel-2); color: var(--text-2); border: 1px solid var(--line-2); }
  table.st { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.st th { text-align: right; font-weight: 500; color: var(--text-3); font-size: 12px; padding: 7px 18px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  table.st th:first-child, table.st td:first-child { text-align: left; }
  table.st td { text-align: right; padding: 9px 18px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.st tr:last-child td { border-bottom: 0; }
  table.st tr[data-stock], table.st tr[data-mk] { cursor: pointer; }
  table.st tr[data-stock]:hover td, table.st tr[data-mk]:hover td { background: var(--hover); }
  table.st .nm { font-weight: 600; display: flex; align-items: center; gap: 7px; }
  table.st .cd { color: var(--text-3); font-size: 11.5px; font-weight: 500; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); }
  .stats div { padding: 10px 18px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
  .stats div:nth-child(4n) { border-right: 0; }
  .stats span { display: block; font-size: 11.5px; color: var(--text-3); }
  .stats b { font-size: 14px; font-weight: 600; }
  .seg { display: inline-flex; background: var(--panel-2); border-radius: 8px; padding: 2px; }
  .seg button { padding: 4px 12px; border-radius: 6px; font-size: 12.5px; color: var(--text-2); font-weight: 600; white-space: nowrap; }
  .seg button.on { background: var(--panel); color: var(--text-1); box-shadow: 0 0 0 1px var(--line-2); }
  .seg-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px 0; gap: 8px; }
  .chart { padding: 8px 12px 6px; position: relative; }
  .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart .tip { position: absolute; top: 0; pointer-events: none; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 3px 8px; font-size: 12px; white-space: nowrap; display: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 16px; }
  .chips a { font-size: 13px; padding: 5px 8px 5px 10px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); display: inline-flex; gap: 7px; align-items: center; }
  .chips a:hover { border-color: var(--line-2); }
  .chips .chg { min-width: 0; font-size: 12px; padding: 1px 6px; }
  .prose { padding: 0 18px 14px; color: var(--text-2); font-size: 13.5px; line-height: 1.8; white-space: pre-wrap; }
  .prose.clamp { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  .facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px 18px; padding: 0 18px 14px; font-size: 13px; }
  .facts .wide { grid-column: 1 / -1; }
  .facts span { color: var(--text-3); margin-right: 8px; }
  .linkbtn { color: var(--accent); font-weight: 600; font-size: 13px; padding: 0 18px 16px; display: inline-flex; gap: 4px; align-items: center; }

  /* 异动归因 */
  .mk-head { display: flex; align-items: baseline; gap: 14px; padding: 18px 18px 4px; flex-wrap: wrap; }
  .mk-head h3 { font-size: 21px; font-weight: 800; }
  .mk-head .big { font-size: 24px; font-weight: 800; }
  .mk-head .pct { font-size: 15px; }
  .mk-head .th { color: var(--text-3); font-size: 12px; margin-left: auto; }
  .mv-item { border-top: 1px solid var(--line); padding: 12px 18px; }
  .mv-item.on { background: var(--hover); }
  .mv-item .head { display: flex; gap: 12px; align-items: center; cursor: pointer; }
  .mv-item .no { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; color: #fff; flex: none; }
  .mv-item .rng { font-weight: 600; }
  .mv-item .sub { color: var(--text-3); font-size: 12px; }
  .reasons { margin: 10px 0 2px 34px; display: grid; gap: 4px; }
  .reason { display: grid; grid-template-columns: 44px 1fr; gap: 8px; padding: 7px 0; border-top: 1px dashed var(--line); }
  .reason:first-child { border-top: 0; }
  .reason .tm { font-size: 12px; color: var(--text-3); padding-top: 2px; }
  .reason .tt { font-size: 14px; font-weight: 600; }
  .reason .tt:hover { color: var(--accent); }
  .reason .ln { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
  .reason .sm { font-size: 12.5px; color: var(--text-2); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* 快讯：紧凑时间线 */
  .filters { display: flex; gap: 8px; align-items: center; padding: 0 18px 10px; overflow-x: auto; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip { flex: none; font-size: 12.5px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--text-2); white-space: nowrap; }
  .chip.on { color: #fff; border-color: transparent; }

function cellHtml(s, x, y, w, h) {

    ${label ? `<b style="font-size:${fs}px">${esc(shortName(s.name).slice(0, 12))}</b>${h > 36 ? `<span class="num" style="font-size:${fs * 0.78}px">${s.pct == null ? '—' : sign(s.pct.toFixed(2)) + '%'}</span>` : ''}` : ''}</div>`;

// 画页面上所有 .heat：data-heat="主题1,主题2"（按主题分组）或 data-one="主题"（单个主题的成分股）
function drawHeats() {
  document.querySelectorAll('.heat').forEach(box => {
    const W = box.clientWidth; if (!W) return;
    let html = '';
    if (box.dataset.one) {
      const H = W < 600 ? 420 : Math.round(W * 0.36);
      box.style.height = H + 'px';
      squarify(stockCells(TH.themes[box.dataset.one]), 0, 0, W, H).forEach(({ item, x, y, w, h }) => { html += cellHtml(item, x, y, w, h); });
    } else {
      const keys = box.dataset.heat.split(',');
      const groups = keys.map(k => { const t = TH.themes[k], st = stockCells(t); return { key: k, t, st, v: st.reduce((a, s) => a + Math.sqrt(s.v), 0) }; })
        .filter(g => g.v > 0).sort((a, b) => b.v - a.v);   // 主题块面积用开方市值，避免巨头把小主题挤没
      const H = W < 600 ? Math.max(560, keys.length * 50) : Math.round(W * (keys.length > 10 ? 0.5 : 0.36));
      box.style.height = H + 'px';
      squarify(groups, 0, 0, W, H).forEach(({ item: g, x, y, w, h }) => {
        const head = h > 40 ? 20 : 0;
        html += `<div class="grp" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
          ${head ? `<div class="gl" data-th="${g.key}"><span>${esc(g.t.name)}</span><span class="num ${cls(themePct(g.t))}">${themePct(g.t) == null ? '' : sign(themePct(g.t).toFixed(2)) + '%'}</span></div>` : ''}`;
        squarify(g.st, 0, head, w - 4, h - 4 - head).forEach(({ item, x: sx, y: sy, w: sw, h: sh }) => { html += cellHtml(item, sx, sy, sw, sh); });
        html += '</div>';
      });
    }
    box.innerHTML = html;
  });
}

function buildSummary() {
  const cites = [];
  const cite = n => { if (!n) return ''; let i = cites.findIndex(c => c.id === n.id); if (i < 0) { cites.push(n); i = cites.length - 1; } return `<a class="cite" href="#news/${n.id}" data-news="${n.id}" title="${esc(n.title)}">${i + 1}</a>`; };
  const M = id => D.markets.find(m => m.id === id);
  const moveNews = m => (m?.moves || []).slice().sort((a, b) => Math.abs(b.chg) - Math.abs(a.chg)).flatMap(mv => mv.news.map(x => NEWS[x.id])).filter(Boolean);
  const say = m => `${esc(m.name)} <b class="${cls(m.chg)}">${m.chg > 0 ? '涨' : '跌'} ${Math.abs(m.chg).toFixed(2)}%</b>`;
  const verb = v => v <= -3 ? '重挫' : v <= -1 ? '走低' : v < 1 ? '窄幅震荡' : v < 3 ? '走高' : '大涨';
  const lines = [['美股', ['100.NDX', '100.SPX']], ['亚太', ['100.N225', '100.KS11']], ['A股港股', ['1.000001', '100.HSI']]].map(([g, ids]) => {
    const ms = ids.map(M).filter(Boolean); if (!ms.length) return '';
    const avg = ms.reduce((a, m) => a + m.chg, 0) / ms.length;
    const news = moveNews(ms.slice().sort((a, b) => Math.abs(b.chg) - Math.abs(a.chg))[0]);
    return `<b>${g}${verb(avg)}</b>：${ms.map(say).join('，')}${news[0] ? `。可能相关：${esc(news[0].title)}${cite(news[0])}${cite(news[1])}` : ''}`;
  }).filter(Boolean);
  const g = TH.tabs.find(t => t.key === 'global');
  const ind = g.sections.find(s => s.kind === 'theme').items.map(k => ({ ...TH.themes[k], pct: themePct(TH.themes[k]) })).filter(t => t.pct != null).sort((a, b) => a.pct - b.pct);
  if (ind.length > 1) lines.push(`<b>产业主题</b>：${esc(ind[0].name)} <b class="${cls(ind[0].pct)}">${sign(ind[0].pct.toFixed(2))}%</b> 表现最弱，${esc(ind.at(-1).name)} <b class="${cls(ind.at(-1).pct)}">${sign(ind.at(-1).pct.toFixed(2))}%</b> 相对最强`);

  lines.push(`<b>大宗与避险</b>：布伦特原油 ${p(q('112.B00Y').pct)}，黄金 ${p(q('122.XAU').pct)}，恐慌指数 VIX ${q('cboe.VIX').price ?? '—'}（${p(q('cboe.VIX').pct)}）`);
  const top = D.events[0];
  if (top) lines.push(`<b>最受关注</b>：${esc(top.title)}（${top.refs.length} 家报道）${top.refs.slice(0, 3).map(id => cite(NEWS[id])).join('')}`);

}

const MV_COLORS = ['#2962ff', '#7b61ff', '#00b8d4', '#ff9800', '#e040fb', '#8bc34a'];
function chartSvg(m) {
  const W = 800, H = 270, P = { l: 8, r: 64, t: 14, b: 24 };
  const p = m.pts, n = p.length;
  if (n < 2) return '<div class="empty">暂无分时数据</div>';
  const vs = p.map(x => x[1]).concat(m.pre);
  let lo = Math.min(...vs), hi = Math.max(...vs); const pd = (hi - lo) * 0.08 || 1; lo -= pd; hi += pd;
  const X = i => P.l + i / (n - 1) * (W - P.l - P.r), Y = v => P.t + (hi - v) / (hi - lo) * (H - P.t - P.b);
  const idxOf = ts => { let b = 0, bd = Infinity; p.forEach((x, i) => { const d = Math.abs(x[0] - ts); if (d < bd) { bd = d; b = i; } }); return b; };
  const line = p.map((x, i) => `${X(i).toFixed(1)},${Y(x[1]).toFixed(1)}`).join(' ');
  const col = m.chg >= 0 ? 'var(--up)' : 'var(--down)';
  const grid = [0, .25, .5, .75, 1].map(f => `<line x1="${P.l}" x2="${W - P.r}" y1="${P.t + f * (H - P.t - P.b)}" y2="${P.t + f * (H - P.t - P.b)}" stroke="var(--line)" stroke-width="1"/>`).join('');
  let segs = '';
  m.moves.forEach((mv, k) => {
    if (mv.kind === 'gap') return;
    const a = idxOf(mv.start), b = idxOf(mv.end), c = MV_COLORS[k % MV_COLORS.length], on = k === state.move;
    segs += `<rect x="${X(a)}" y="${P.t}" width="${Math.max(2, X(b) - X(a))}" height="${H - P.t - P.b}" fill="${c}" opacity="${on ? .16 : .06}" data-mvi="${k}" style="cursor:pointer"/>`;
    segs += `<polyline fill="none" stroke="${c}" stroke-width="${on ? 3 : 2}" points="${p.slice(a, b + 1).map((x, j) => `${X(a + j).toFixed(1)},${Y(x[1]).toFixed(1)}`).join(' ')}"/>`;
    segs += `<g data-mvi="${k}" style="cursor:pointer"><circle cx="${X(b)}" cy="${Y(p[b][1])}" r="9" fill="${c}"/><text x="${X(b)}" y="${Y(p[b][1]) + 4}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${k + 1}</text></g>`;
  });
  const ticks = [0, .25, .5, .75, 1].map(f => Math.round(f * (n - 1)));
  const tickTxt = ticks.map(i => `<text x="${X(i)}" y="${H - 6}" font-size="11" fill="var(--text-3)" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${hm(p[i][0])}</text>`).join('');
  const yTicks = [hi - pd, (hi + lo) / 2, lo + pd].filter(v => Math.abs(Y(v) - Y(m.pre)) > 14).map(v => `<text x="${W - P.r + 6}" y="${Y(v) + 4}" font-size="11" fill="var(--text-3)">${fmtPx(v, m.dec)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" id="mkChart">
    <defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".2"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    <line x1="${P.l}" x2="${W - P.r}" y1="${Y(m.pre)}" y2="${Y(m.pre)}" stroke="var(--text-3)" stroke-dasharray="3 4" stroke-width="1"/>
    <text x="${W - P.r + 6}" y="${Y(m.pre) + 4}" font-size="10.5" fill="var(--text-3)">昨收</text>
    <polygon points="${X(0)},${H - P.b} ${line} ${X(n - 1)},${H - P.b}" fill="url(#ga)"/>
    <polyline fill="none" stroke="${col}" stroke-width="1.6" points="${line}"/>
    ${segs}${tickTxt}${yTicks}
    <line id="cross" x1="0" x2="0" y1="${P.t}" y2="${H - P.b}" stroke="var(--text-3)" stroke-width="1" style="display:none"/>
  </svg><div class="tip" id="tip"></div>`;
}

function bindChart(m) {
  const svg = $('#mkChart'), tip = $('#tip'), cross = $('#cross'); if (!svg) return;
  const n = m.pts.length;
  svg.addEventListener('mousemove', e => {
    const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 800;
    const i = Math.max(0, Math.min(n - 1, Math.round((x - 8) / (800 - 72) * (n - 1))));
    const [t, v] = m.pts[i], X = 8 + i / (n - 1) * (800 - 72);
    cross.setAttribute('x1', X); cross.setAttribute('x2', X); cross.style.display = '';
    const c = m.unit === 'bp' ? (v - m.pre) * 100 : (v / m.pre - 1) * 100;
    tip.innerHTML = `<span class="num">${hm(t)}</span>　<b class="num">${fmtPx(v, m.dec)}</b>　<span class="num ${cls(c)}">${fmtChg(c, m.unit)}</span>`;
    tip.style.display = 'block';
    const px = X / 800 * r.width;
    tip.style.left = Math.min(r.width - tip.offsetWidth, Math.max(0, px - tip.offsetWidth / 2)) + 12 + 'px';
  });
  svg.addEventListener('mouseleave', () => { tip.style.display = 'none'; cross.style.display = 'none'; });
}

function jsonp(url, timeout = 8000) {
  return new Promise((resolve, reject) => {
    const cb = '__mw' + (++jsonpSeq) + '_' + Date.now().toString(36);
    const s = document.createElement('script');
    const done = () => { clearTimeout(t); window[cb] = () => {}; s.remove(); };
    const t = setTimeout(() => { done(); reject(new Error('timeout')); }, timeout);
    window[cb] = d => { done(); resolve(d); };
    s.onerror = () => { done(); reject(new Error('network')); };
    s.src = url + (url.includes('?') ? '&' : '?') + 'cb=' + cb;
    document.head.appendChild(s);
  });
}

function kwRe(kw) {
  const parts = kw.split('|').map(tok => {
    if (!/^[A-Za-z]/.test(tok)) return tok;
    const core = tok.replace(/\\b/g, '');
    const body = /^[A-Z0-9.]{2,6}$/.test(core) ? core.replace(/[A-Za-z]/g, c => `[${c}]`) : core.replace(/[A-Za-z]/g, c => `[${c.toLowerCase()}${c.toUpperCase()}]`);
    return `(?<![A-Za-z])${body}(?![A-Za-z])`;
  });
  return new RegExp(parts.join('|'));
}
function newsFor(re, limit = 15) {
  const out = [], seen = new Set();          // 同一条消息多家转载，只留一条（列表按时间倒序，留的是最新那条）
  for (const n of D.news) {
    if (!re.test(n.title + ' ' + n.summary.slice(0, 120))) continue;
    const k = n.title.replace(/[\s\p{P}]/gu, '').slice(0, 18).toLowerCase();
    if (seen.has(k)) continue;
    seen.add(k); out.push(n);
    if (out.length >= limit) break;
  }
  return out;
}

async function fetchKline(id, klt) {

async function loadChart(id, period, sel) {

  DETAIL.chartKey = key;

    const data = period === 'trend' ? await fetchTrend(id) : await fetchKline(id, period);

  } catch { if (DETAIL.chartKey === key && $(sel)) $(sel).innerHTML = '<div class="empty">图表数据暂时取不到</div>'; }
}
const gridLines = (W, H, P) => [0, .25, .5, .75, 1].map(f => `<line x1="${P.l}" x2="${W - P.r}" y1="${P.t + f * (H - P.t - P.b)}" y2="${P.t + f * (H - P.t - P.b)}" stroke="var(--line)"/>`).join('');
function trendSvg({ pre, pts }) {
  const W = 800, H = 240, P = { l: 8, r: 64, t: 12, b: 22 }, n = pts.length;
  const vs = pts.map(p => p[1]).concat(pre); let lo = Math.min(...vs), hi = Math.max(...vs); const pd = (hi - lo) * 0.08 || 1; lo -= pd; hi += pd;
  const X = i => P.l + i / Math.max(1, n - 1) * (W - P.l - P.r), Y = v => P.t + (hi - v) / (hi - lo) * (H - P.t - P.b);
  const last = pts[n - 1][1], col = last >= pre ? 'var(--up)' : 'var(--down)';
  const line = pts.map((p, i) => `${X(i).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ');
  const ticks = [0, .5, 1].map(f => Math.round(f * (n - 1)));
  return `<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="gt" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".2"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${gridLines(W, H, P)}
    <line x1="${P.l}" x2="${W - P.r}" y1="${Y(pre)}" y2="${Y(pre)}" stroke="var(--text-3)" stroke-dasharray="3 4"/>
    <text x="${W - P.r + 6}" y="${Y(pre) + 4}" font-size="11" fill="var(--text-3)">${fmtP(pre)}</text>
    <polygon points="${X(0)},${H - P.b} ${line} ${X(n - 1)},${H - P.b}" fill="url(#gt)"/>
    <polyline fill="none" stroke="${col}" stroke-width="1.6" points="${line}"/>
    <rect x="${W - P.r + 2}" y="${Y(last) - 9}" width="${P.r - 4}" height="18" rx="4" fill="${col}"/>
    <text x="${W - P.r + P.r / 2}" y="${Y(last) + 4}" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">${fmtP(last)}</text>
    ${ticks.map(i => `<text x="${X(i)}" y="${H - 5}" font-size="11" fill="var(--text-3)" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${pts[i][0]}</text>`).join('')}</svg>`;
}
function klineSvg(k) {
  const W = 800, H = 260, P = { l: 8, r: 64, t: 12, b: 22 }, n = k.length;
  let lo = Math.min(...k.map(x => x.l)), hi = Math.max(...k.map(x => x.h)); const pd = (hi - lo) * 0.05 || 1; lo -= pd; hi += pd;
  const cw = (W - P.l - P.r) / n, X = i => P.l + (i + 0.5) * cw, Y = v => P.t + (hi - v) / (hi - lo) * (H - P.t - P.b);
  const bars = k.map((x, i) => { const c = x.c >= x.o ? 'var(--up)' : 'var(--down)', y1 = Y(Math.max(x.o, x.c)), y2 = Y(Math.min(x.o, x.c));
    return `<line x1="${X(i)}" x2="${X(i)}" y1="${Y(x.h)}" y2="${Y(x.l)}" stroke="${c}"/><rect x="${X(i) - cw * 0.35}" y="${y1}" width="${cw * 0.7}" height="${Math.max(1, y2 - y1)}" fill="${c}"/>`; }).join('');
  const ticks = [0, Math.floor(n / 2), n - 1];
  return `<svg viewBox="0 0 ${W} ${H}">${gridLines(W, H, P)}${bars}
    ${[hi - pd, (hi + lo) / 2, lo + pd].map(v => `<text x="${W - P.r + 6}" y="${Y(v) + 4}" font-size="11" fill="var(--text-3)">${fmtP(v)}</text>`).join('')}
    ${ticks.map(i => `<text x="${X(i)}" y="${H - 5}" font-size="11" fill="var(--text-3)" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${k[i].t}</text>`).join('')}</svg>`;
}

  const facts = [['公司全称', esc(p.ORG_NAME), 'wide'], ['所属行业', esc(p.EM2016 || p.BELONG_INDUSTRY)], ['董事长', esc(p.CHAIRMAN)],
    ['成立日期', date(p.FOUND_DATE)], ['上市日期', date(p.LISTING_DATE)], ['员工人数', p.EMP_NUM ? (+p.EMP_NUM).toLocaleString('en-US') + ' 人' : ''],
    ['官网', web ? `<a style="color:var(--accent)" href="${esc(/^https?:/i.test(web) ? web : 'http://' + web)}" target="_blank" rel="noopener">${esc(web)}</a>` : '']].filter(f => f[1]);
  const intro = String(p.ORG_PROFILE || '').trim();
  box.innerHTML = `<h2>公司简介 <small>东方财富 F10</small></h2>
    <div class="facts">${facts.map(([k, v, w]) => `<div class="${w || ''}"><span>${k}</span>${v}</div>`).join('')}</div>
    ${intro ? `<div class="prose ${DETAIL.expand ? '' : 'clamp'}">${esc(intro)}</div>${intro.length > 150 ? `<button class="linkbtn" data-expand>${DETAIL.expand ? '收起' : '展开全文'}</button>` : ''}` : ''}
    ${p.MAIN_BUSINESS ? `<div class="prose"><b style="color:var(--text-1)">主营业务：</b>${esc(p.MAIN_BUSINESS)}</div>` : ''}`;
}

// 当前页面需要的行情 id
function viewIds() {
  if (BOARDS.includes(state.tab)) return tabIds(TH.tabs.find(t => t.key === state.tab));
  if (state.tab === 'theme' && TH.themes[state.theme]) return themeIds(TH.themes[state.theme]);
  if (state.tab === 'stock') return [state.stock];
  if (state.tab === 'overview') {   // 总览的热力图和总结也用实时行情
    const g = TH.tabs.find(t => t.key === 'global');
    return [...tabIds(g)];
  }
  return [];
}
async function refreshQuotes(force) {
  const ids = viewIds(); if (!ids.length) return;
  await fetchQuotes(ids, force);
  // 只更新数字和热力图，不重画详情页图表、不打断展开状态
  const y = scrollY, keep = { chart: $('#dchart')?.innerHTML, prof: $('#profile')?.innerHTML };
  if (state.tab === 'stock') renderStock(state.stock, keep);
  else if (state.tab === 'theme') renderTheme(state.theme, keep);
  else if (BOARDS.includes(state.tab)) renderBoard(state.tab);
  else if (state.tab === 'overview') {
    const open = [...document.querySelectorAll('.ev')].map((e, i) => e.classList.contains('open') ? i : -1).filter(i => i >= 0);
    renderOverview();
    const evs = document.querySelectorAll('.ev'); open.forEach(i => evs[i]?.classList.add('open'));
  }
  scrollTo(0, y);
}

// ── 新闻详情（站内）──
// 这几家的文章页允许被内嵌，实测能正常显示；其余（新浪没有单条文章页，海外媒体禁止内嵌或要人机验证）只给原文按钮
const EMBED = ['eastmoney', 'ths', 'wscn', 'gelonghui'];
function reaction(n) {
  const rows = [];
  (n.mk || []).forEach(id => {
    const m = D.markets.find(x => x.id === id); if (!m || m.pts.length < 2) return;
    const p = m.pts, first = p[0][0], last = p[p.length - 1][0];
    if (n.ts < first - 600 || n.ts > last) return;            // 发布时不在这个品种的交易时段内
    const at = p.find(x => x[0] >= n.ts) || p[p.length - 1];
    const later = p.filter(x => x[0] <= n.ts + 1800).pop() || at;
    const c = m.unit === 'bp' ? (later[1] - at[1]) * 100 : (later[1] / at[1] - 1) * 100;
    rows.push({ m, at, later, c });
  });
  return rows;
}
function renderNews(id) {
  const n = NEWS[id];
  if (!n) {
    $('#view').innerHTML = `<div class="page"><div><button class="back" data-back="">${ic('back')}返回</button></div>
      <div class="card"><div class="empty">这条消息已超过 48 小时，不在本站快讯库里了</div></div></div>`;
    return;
  }
  const s = SRC[n.src] || {};
  const text = n.summary && n.summary !== n.title ? n.summary : '';
  const rx = reaction(n);
  const moves = [];
  D.markets.forEach(m => m.moves.forEach((mv, i) => { if (mv.news.some(x => x.id === id)) moves.push({ m, mv, i }); }));
  const ev = D.events.find(e => e.refs.includes(id));
  const others = ev ? ev.refs.filter(r => r !== id).map(r => NEWS[r]).filter(Boolean) : [];
  const themes = Object.entries(TH.themes).filter(([, t]) => kwRe(t.kw).test(n.title + ' ' + n.summary)).slice(0, 8);
  const embed = EMBED.includes(n.src) && /^https?:\/\//.test(n.url);
  $('#view').innerHTML = `<div class="page">
    <div><button class="back" data-back="">${ic('back')}返回</button></div>
    <article class="card art"><div class="art-in">
      <div class="art-meta">${srcBadge(n.src)}<span>${esc(s.name || n.src)}</span><span class="num">${whenText(n.ts)}${n.est ? ' 前后' : ''}</span>${n.imp >= 2 ? '<span class="impt">重要</span>' : ''}${n.factors.map(facTag).join('')}</div>
      <h1 class="art-t">${esc(n.title)}</h1>
      ${text ? `<div class="art-body">${esc(text)}</div>` : ''}
      ${n.lang === 'en' ? `<div class="art-note">${ic('info')}海外媒体只提供标题${text ? '和摘要' : ''}，全文请到原站阅读${s.paywall ? '（收费）' : ''}</div>` : ''}
      <a class="btn" href="${esc(n.url)}" target="_blank" rel="noopener">阅读原文 ${ic('ext')}</a>
    </div></article>
    ${rx.length ? `<div class="card"><h2>${ic('chartline')}发布后的行情 <small>发布时刻 → 30 分钟后 · 只是时间先后，不代表因果</small></h2>
      <table class="st"><thead><tr><th>品种</th><th>发布时</th><th>30 分钟后</th><th>变化</th></tr></thead><tbody>
      ${rx.map(r => `<tr data-mk="${r.m.id}"><td><div class="nm">${esc(r.m.name)}</div></td><td class="num">${fmtPx(r.at[1], r.m.dec)} <span class="cd">${hm(r.at[0])}</span></td>
        <td class="num">${fmtPx(r.later[1], r.m.dec)} <span class="cd">${hm(r.later[0])}</span></td><td>${chgBlock(+r.c.toFixed(2), r.m.unit)}</td></tr>`).join('')}
      </tbody></table></div>` : ''}
    ${moves.length ? `<div class="card"><h2>${ic('bolt')}被列为这些异动的可能原因</h2>${moves.map(moveRow).join('')}</div>` : ''}
    ${others.length ? `<div class="card"><h2>${ic('news')}同一事件的其他报道</h2>${others.map(o => feedItem(o, false)).join('')}</div>` : ''}
    ${themes.length ? `<div class="card"><h2>相关主题</h2><div class="chips">${themes.map(([k, t]) => `<a href="#theme/${k}" data-th="${k}">${themeIco(t)}${esc(t.name)} ${chgBlock(themePct(t))}</a>`).join('')}</div></div>` : ''}
    ${embed ? `<div class="card"><h2>原文 <small>${esc(s.name)} 原站页面</small><a class="r more-link" href="${esc(n.url)}" target="_blank" rel="noopener">打不开？新窗口打开 ${ic('ext')}</a></h2>
      <iframe class="orig" src="${esc(n.url)}" loading="lazy" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe></div>` : ''}
  </div>`;
}

// ── 路由与交互 ──
const BOARDS = ['global', 'metals', 'ai'];
function render() {
  if (BOARDS.includes(state.tab)) state.from = state.tab;
  if (!['theme', 'stock', 'news'].includes(state.tab)) state.top = state.tab;    // 详情页高亮进入前所在的标签
  const hl = state.tab === 'theme' ? parentTab(state.theme) : ['stock', 'news'].includes(state.tab) ? state.top : state.tab;
  document.querySelectorAll('nav.tabs [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === hl));
  // 底部标签栏没有「异动归因」，归到总览
  document.querySelectorAll('nav.tabbar [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === (hl === 'market' ? 'overview' : hl)));
  const showTicker = state.tab === 'overview' || state.tab === 'market';
  $('#ticker').style.display = showTicker ? '' : 'none';
  if (showTicker) renderTicker();
  ({ overview: renderOverview, market: renderMarket, feed: renderFeed,
     global: () => renderBoard('global'), metals: () => renderBoard('metals'), ai: () => renderBoard('ai'),
     theme: () => renderTheme(state.theme), stock: () => renderStock(state.stock), news: () => renderNews(state.news) })[state.tab]();
}
function hashOf() {
  if (state.tab === 'market') return `#market/${state.market}/${state.move}`;
  if (state.tab === 'feed') return `#feed${state.factor ? '/' + state.factor : ''}`;
  if (state.tab === 'theme') return `#theme/${state.theme}`;
  if (state.tab === 'stock') return `#stock/${state.stock}`;
  if (state.tab === 'news') return `#news/${state.news}`;
  return '#' + state.tab;
}
function setHash(push) {
  const h = hashOf();
  if (location.hash === h) return;
  if (push) { history.pushState(null, '', h); state.depth++; } else history.replaceState(null, '', h);
}
function readHash() {
  const [tab, a, b] = location.hash.slice(1).split('/');
  if (tab === 'market') { state.tab = 'market'; state.market = a || null; state.move = +b || 0; }
  else if (tab === 'feed') { state.tab = 'feed'; state.factor = a || ''; }
  else if (tab === 'theme' && TH?.themes[a]) { state.tab = 'theme'; state.theme = a; }
  else if (tab === 'stock' && a) { state.tab = 'stock'; state.stock = decodeURIComponent(a); }
  else if (tab === 'news' && a) { state.tab = 'news'; state.news = a; }
  else state.tab = BOARDS.includes(tab) ? tab : 'overview';
}
// 主题、个股、新闻是「进入」的下一层，写入浏览器历史，返回键能回来；其余标签切换替换当前记录
function go(patch) {
  Object.assign(state, patch);
  setHash(['theme', 'stock', 'news'].includes(state.tab));
  render(); window.scrollTo({ top: 0 });
  if (viewIds().length) refreshQuotes(true);
}

document.addEventListener('click', e => {
  const t = e.target;
  const nw = t.closest('[data-news]');
  if (nw) { e.preventDefault(); e.stopPropagation(); return go({ tab: 'news', news: nw.dataset.news }); }
  const th = t.closest('[data-th]');   // 注意不能用 data-theme：<html> 上的深浅色属性也叫这个
  if (th) { e.preventDefault(); return go({ tab: 'theme', theme: th.dataset.th }); }
  const sk = t.closest('[data-stock]');
  if (sk) return go({ tab: 'stock', stock: sk.dataset.stock });
  const bk = t.closest('[data-back]');
  if (bk) { if (state.depth > 0) { state.depth--; history.back(); } else go({ tab: bk.dataset.back || state.from || 'global' }); return; }
  const pd = t.closest('[data-period]');
  if (pd) { DETAIL.period = pd.dataset.period; document.querySelectorAll('#periods button').forEach(b => b.classList.toggle('on', b === pd));
    $('#dchart').innerHTML = '<div class="empty">图表加载中…</div>'; return loadChart(state.stock, DETAIL.period, '#dchart'); }
  if (t.closest('[data-expand]')) { DETAIL.expand = !DETAIL.expand; return paintProfile(state.stock); }
  const tab = t.closest('[data-tab]');
  if (tab) { e.preventDefault(); return go({ tab: tab.dataset.tab, ...(tab.dataset.tab === 'market' && !state.market ? { market: defaultMarket(), move: 0 } : {}) }); }
  const mm = t.closest('[data-mkmv]');
  if (mm) { const [mk, i] = mm.dataset.mkmv.split('|'); return go({ tab: 'market', market: mk, move: +i }); }
  const tk = t.closest('[data-mk]');
  if (tk) return go({ tab: 'market', market: tk.dataset.mk, move: 0 });
  const mvi = t.closest('[data-mvi]');
  if (mvi && !t.closest('a')) { state.move = +mvi.dataset.mvi; setHash(); renderMarket(); return; }
  const fac = t.closest('[data-fac]');
  if (fac) return go({ tab: 'feed', factor: fac.dataset.fac, lang: 'all', imp: false, q: '', limit: 80 });
  const ev = t.closest('[data-ev]');
  if (ev && !t.closest('a')) return ev.classList.toggle('open');
  const l = t.closest('#segLang button');
  if (l) { state.lang = l.dataset.l; state.limit = 80; return renderFeed(); }
  const f = t.closest('[data-f]');
  if (f) { state.factor = state.factor === f.dataset.f ? '' : f.dataset.f; state.limit = 80; setHash(); return renderFeed(); }
  if (t.closest('#chipImp')) { state.imp = !state.imp; state.limit = 80; return renderFeed(); }
  if (t.closest('#more')) { state.limit += 120; return renderFeed(); }
});
let qTimer;
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { state.q = e.target.value; state.limit = 80; const pos = e.target.selectionStart; renderFeed(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }, 200);
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); if (state.tab !== 'feed') go({ tab: 'feed' }); $('#q')?.focus(); }
});
window.addEventListener('popstate', () => { readHash(); render(); if (viewIds().length) refreshQuotes(true); });
let rsTimer;
window.addEventListener('resize', () => { clearTimeout(rsTimer); rsTimer = setTimeout(() => { if (D) drawHeats(); }, 150); });

// 异动归因默认打开上证指数；看过别的品种就打开上次看的那个
function defaultMarket() {
  const last = LS.get('mw-market', '');
  if (D.markets.some(m => m.id === last)) return last;
  return D.markets.some(m => m.id === '1.000001') ? '1.000001' : D.markets[0]?.id;
}

// 深浅色
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $('#btnTheme').innerHTML = ic(t === 'dark' ? 'moon' : 'sun');
}
applyTheme(LS.get('mw-theme', matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
$('#btnTheme').onclick = () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; LS.set('mw-theme', t); applyTheme(t); if (D) drawHeats(); };

// 来源状态
$('#btnSrc').onclick = () => {
  const dlg = $('#dlgSrc');
  dlg.innerHTML = `<h3>来源状态</h3><p>更新于 ${esc(D.updated.replace('T', ' ').slice(0, 16))}（北京时间）。带锁图标的是收费媒体，只取标题与摘要。</p>
    ${D.sources.map(s => `<div class="src-row"><span class="dot" style="background:${s.ok ? 'var(--down)' : 'var(--up)'}"></span><span>${esc(s.name)}${s.paywall ? '（收费）' : ''}</span><span class="num" style="color:var(--text-3)">${s.count}</span>${s.error ? `<span class="err">${esc(s.error)}</span>` : ''}</div>`).join('')}
    <button class="close" onclick="this.closest('dialog').close()">关闭</button>`;
  dlg.showModal();
};

async function load() {
  try {
    [D, TH] = await Promise.all(['data.json', 'themes.json'].map(f => fetch(f + '?t=' + Date.now()).then(r => r.json())));
  } catch (e) { $('#view').innerHTML = `<div class="empty">数据加载失败：${esc(e.message)}</div>`; return; }
  Object.entries(D.quotes || {}).forEach(([id, q]) => { if (!qLive[id]) Q[id] = q; });   // 快照兜底，实时数据优先
  NEWS = Object.fromEntries(D.news.map(n => [n.id, n]));
  SRC = Object.fromEntries(D.sources.map(s => [s.id, s]));
  FAC = Object.fromEntries(D.factors.map(f => [f.key, f]));
  const bad = D.sources.filter(s => !s.ok).length;
  $('#updated').textContent = `更新于 ${D.updated.slice(5, 16).replace('T', ' ')}${bad ? ` · ${bad} 个来源异常` : ''}`;
  if (first) {
    first = false;
    readHash();
    if (state.tab === 'market' && !D.markets.some(m => m.id === state.market)) state.market = defaultMarket();
    render();
    if (viewIds().length) refreshQuotes(true);
  } else if (state.tab === 'market') render();   // 定时重读：总览由行情刷新带动，快讯页、详情页不打断
}
let first = true;
try { localStorage.removeItem('mw-view'); } catch {}   // 旧版「热力图 / 卡片」切换的记忆，已不用
load();
setInterval(load, 5 * 60 * 1000);   // 每 5 分钟重新读一次 data.json
setInterval(() => { if (document.visibilityState === 'visible') refreshQuotes(); }, 30 * 1000);   // 行情 30 秒刷新
</script>
